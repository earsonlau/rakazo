name: Reproduce header-hit E2E
on:
  push:
    branches: [codex/e2e-reproduction]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, broken-layering]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: earsonlau/rakazo
          ref: 258bb70ef85eace87f45654e6bba01143f46d645
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rakazo/web exec playwright install chromium
      - name: Restore the old layering for the negative control
        if: matrix.variant == 'broken-layering'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/shell/transcript.tsx')
          text = path.read_text()
          assert text.count('group/message relative hover:z-[1]') == 1
          path.write_text(text.replace('group/message relative hover:z-[1]', 'group/message relative hover:z-20'))
          PY
      - name: Check the repaired test and negative control
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          pnpm test:e2e -- --sandbox=fake --grep='message hover shows beside-bubble actions' > header-test.log 2>&1
          result=$?
          tail -n 60 header-test.log
          if [ "$VARIANT" = fixed ]; then exit "$result"; fi
          test "$result" -ne 0 && grep -q 'expect(headerReceivesHit).toBe(true)' header-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-control-${{ matrix.variant }}
          path: |
            apps/web/test-results
            blob-report
            header-test.log
          retention-days: 7
