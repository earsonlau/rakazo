name: Reproduce header-hit E2E
on:
  push:
    branches: [codex/e2e-reproduction]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        revision: [c010878b1824c048089e96935f442a3f1d4b3f04, 4257476d5c8d949717a7f7147ce32eaf00482df2]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: elie222/rakazo
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rakazo/web exec playwright install chromium
      - run: pnpm test:e2e -- --sandbox=fake --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-${{ matrix.revision }}-${{ matrix.shard }}
          path: |
            apps/web/test-results
            blob-report
          retention-days: 7
