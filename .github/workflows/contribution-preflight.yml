name: Contribution preflight

on:
  push:
    branches: [codex/contribution-coordination-preflight]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REVISION: af596a9cc2536e09e4e32cd3f5f1dc7a4fb895e8
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

jobs:
  lint:
    name: Full lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check translation catalogs are current
        run: |
          pnpm --filter @rakazo/web intl:extract
          git diff --exit-code -- apps/web/src/locales

  check:
    name: Full typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm check

  build:
    name: Full production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
          BETTER_AUTH_SECRET: preflight-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: preflight-build-encryption-key-at-least-32-characters
      - name: Electron smoke
        run: xvfb-run --auto-servernum pnpm --filter @rakazo/desktop exec playwright test --config e2e/playwright.config.ts

  test:
    name: Full unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Install age for the encrypted backup round trip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: pnpm test
      - name: Host operations safety tests
        run: python3 infra/compose/host-safeguards.test.py
      - name: Codex subscription auth safety tests
        run: python3 .github/scripts/codex-subscription-auth.test.py
      - name: Dependency update patch safety tests
        run: python3 .github/scripts/dependency-update-patch.test.py

  native-computer:
    name: Full native computer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm --filter @rakazo/desktop build
      - run: pnpm exec vitest run packages/adapters/src/host-computer.test.ts packages/adapters/src/desktop-sandbox-command.test.ts packages/adapters/src/desktop-sandbox-paths.test.ts packages/adapters/src/desktop-workspace-cleanup.test.ts packages/adapters/src/computer-support.test.ts apps/desktop/src/host-computer.test.ts
      - name: Native computer in headless Electron
        run: pnpm --filter @rakazo/desktop exec electron ../../node_modules/vitest/vitest.mjs run --root ../.. packages/adapters/src/host-computer.test.ts apps/desktop/src/host-computer.test.ts
        env:
          ELECTRON_RUN_AS_NODE: "1"

  integration:
    name: Full Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  postgres-upgrade:
    name: Full Postgres upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - run: bash infra/compose/upgrade-postgres.docker-test.sh

  e2e:
    name: Full web E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @rakazo/web exec playwright install chromium
      - name: Run Playwright tests
        id: playwright_tests
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e -- --sandbox=fake --shard="$SHARD/4"
      - name: Capture marketing homepage screenshots
        if: matrix.shard == 1 && always() && (steps.playwright_tests.outcome == 'success' || steps.playwright_tests.outcome == 'failure')
        run: pnpm --filter @rakazo/www e2e
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contribution-preflight-e2e-${{ matrix.shard }}
          path: |
            blob-report
            playwright-report-www
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7
